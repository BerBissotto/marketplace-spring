<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cadastro de produto')}"></head>
<body class="d-flex flex-column min-vh-100">
<header>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
</header>

<main class="container flex-grow-1 py-5">
    <section class="page-card p-4 p-md-5" aria-labelledby="titulo-produto">
        <div class="mb-4">
            <h1 id="titulo-produto" class="h2 fw-bold mb-1"
                th:text="${produto.id != null} ? 'Editar produto' : 'Cadastrar produto'">Cadastrar produto</h1>
            <p class="text-muted mb-0">Preencha as informações que serão exibidas na loja.</p>
        </div>

        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

        <form th:action="${produto.id != null} ? @{/produtosadmin/atualizar} : @{/produtosadmin/novo}"
              th:object="${produto}" method="post" enctype="multipart/form-data" class="row g-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}" th:if="${produto.id != null}">

            <div class="col-md-8">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" maxlength="120" required>
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="col-md-4">
                <label for="categoria" class="form-label">Categoria</label>
                <input type="text" id="categoria" class="form-control" th:field="*{categoria}"
                       th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'" maxlength="80" required>
                <div class="invalid-feedback" th:errors="*{categoria}"></div>
            </div>

            <div class="col-12">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea id="descricao" class="form-control" rows="4" th:field="*{descricao}"
                          th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'" maxlength="1000"></textarea>
                <div class="invalid-feedback" th:errors="*{descricao}"></div>
            </div>

            <div class="col-sm-6">
                <label for="quantidade" class="form-label">Quantidade em estoque</label>
                <input type="number" id="quantidade" class="form-control" th:field="*{quantidade}"
                       th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid'" min="0" step="1" required>
                <div class="invalid-feedback" th:errors="*{quantidade}"></div>
            </div>

            <div class="col-sm-6">
                <label for="preco" class="form-label">Preço (R$)</label>
                <input type="number" id="preco" class="form-control" th:field="*{preco}"
                       th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'" min="0.01" step="0.01" required>
                <div class="invalid-feedback" th:errors="*{preco}"></div>
            </div>

            <fieldset class="col-12 mt-4">
                <legend class="h5">Imagens do produto</legend>
                <label for="imagens" class="form-label">Selecionar imagens</label>
                <input type="file" name="imagens" id="imagens" accept="image/*" multiple class="form-control">
                <div class="form-text">Até 10 MB por imagem. Na edição, as novas imagens serão adicionadas às existentes.</div>

                <div class="d-flex flex-wrap gap-2 mt-3"
                     th:if="${produto.id != null && imagensExistentes != null && !#lists.isEmpty(imagensExistentes)}">
                    <img th:each="imagem : ${imagensExistentes}"
                         th:src="@{/imagem/{id}(id=${imagem.id})}"
                         th:alt="${imagem.nome}" class="img-thumbnail admin-table-image"
                         loading="lazy" decoding="async">
                </div>
            </fieldset>

            <div class="col-12 d-flex flex-column flex-sm-row gap-2 mt-4">
                <button type="submit" class="btn btn-success">Salvar produto</button>
                <a th:href="@{/produtosadmin}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer class="mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
