<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuários administrativos')}"></head>
<body class="d-flex flex-column min-vh-100">
<header>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
</header>

<main class="container-fluid flex-grow-1 py-5 px-lg-5">
    <section class="page-card p-3 p-md-4" aria-labelledby="titulo-lista-usuarios">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <div>
                <h1 id="titulo-lista-usuarios" class="h2 fw-bold mb-1">Usuários</h1>
                <p class="text-muted mb-0">Gerencie contas e perfis de acesso.</p>
            </div>
            <a th:href="@{/usuariosadmin/novo}" class="btn btn-primary">Novo usuário</a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <caption class="visually-hidden">Lista de usuários cadastrados</caption>
                <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Contato</th>
                    <th scope="col">CPF</th>
                    <th scope="col">Perfil</th>
                    <th scope="col">Endereço</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td class="fw-semibold" th:text="${usuario.nome}">Nome</td>
                    <td>
                        <span th:text="${usuario.email}">email@exemplo.com</span>
                        <small class="d-block text-muted" th:text="${usuario.telefone}">Telefone</small>
                    </td>
                    <td th:text="${usuario.cpf}">CPF</td>
                    <td><span class="badge text-bg-secondary text-uppercase" th:text="${usuario.role}">USER</span></td>
                    <td style="min-width: 260px;">
                        <span th:if="${usuario.endereco != null}"
                              th:text="${usuario.endereco.logradouro + ', ' + usuario.endereco.numero + ' — ' + usuario.endereco.bairro + ', ' + usuario.endereco.cidade + ' — CEP ' + usuario.endereco.cep}">
                            Endereço
                        </span>
                        <span th:if="${usuario.endereco == null}" class="text-muted">Sem endereço</span>
                    </td>
                    <td class="text-end table-action-group">
                        <div class="d-inline-flex flex-column flex-sm-row gap-2">
                            <a th:href="@{/usuariosadmin/editar/{id}(id=${usuario.id})}"
                               class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{/usuariosadmin/deletar/{id}(id=${usuario.id})}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger btn-sm w-100"
                                        data-confirm="Tem certeza que deseja excluir este usuário?">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="empty-state">Nenhum usuário cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
