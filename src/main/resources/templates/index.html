<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Início')}"></head>
<body class="d-flex flex-column min-vh-100">
<header>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
</header>

<main class="flex-grow-1">
    <section aria-label="Destaques da loja">
        <div id="carouselDestaques" class="carousel slide hero-carousel" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Destaque 1"></button>
                <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="1"
                        aria-label="Destaque 2"></button>
                <button type="button" data-bs-target="#carouselDestaques" data-bs-slide-to="2"
                        aria-label="Destaque 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img th:src="@{/imagens/capa.webp}" class="d-block w-100" alt="Destaque principal da loja"
                         loading="eager" decoding="async" fetchpriority="high" data-image-priority="high">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/imagens/capa2.jpg}" class="d-block w-100" alt="Ofertas do marketplace"
                         loading="lazy" decoding="async">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/imagens/capa3.jpg}" class="d-block w-100" alt="Produtos em destaque"
                         loading="lazy" decoding="async">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselDestaques" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselDestaques" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </section>

    <section class="container py-5" aria-labelledby="titulo-destaques">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <div>
                <h1 id="titulo-destaques" class="h2 fw-bold mb-1">Produtos em destaque</h1>
                <p class="text-muted mb-0">Confira os produtos disponíveis no marketplace.</p>
            </div>
            <a th:href="@{/produtos}" class="btn btn-outline-primary align-self-start align-self-sm-center">Ver todos</a>
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(produtos)}">
            <article class="col-6 col-md-4 col-lg-3" th:each="produto : ${produtos}">
                <div class="card h-100 border-0 shadow-sm product-card">
                    <a th:href="@{/produtos/{id}(id=${produto.id})}" class="text-decoration-none">
                        <img th:src="${!#lists.isEmpty(produto.imagens)} ? @{/imagem/{id}(id=${produto.imagens[0].id})} : @{/imagens/300x300.png}"
                             class="card-img-top product-card__image" th:alt="${produto.nome}"
                             loading="lazy" decoding="async">
                    </a>
                    <div class="card-body d-flex flex-column">
                        <p class="small text-uppercase text-muted mb-1" th:text="${produto.categoria}">Categoria</p>
                        <h2 class="h5 card-title">
                            <a th:href="@{/produtos/{id}(id=${produto.id})}"
                               class="text-decoration-none text-body" th:text="${produto.nome}">Produto</a>
                        </h2>
                        <p class="text-success fw-bold fs-5 mt-auto mb-0"
                           th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 2)}">R$ 0,00</p>
                    </div>
                </div>
            </article>
        </div>

        <div class="page-card empty-state" th:if="${#lists.isEmpty(produtos)}">
            <h2 class="h5">Nenhum produto cadastrado</h2>
            <p class="mb-0">Os produtos aparecerão aqui assim que forem adicionados.</p>
        </div>
    </section>
</main>

<footer class="mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
