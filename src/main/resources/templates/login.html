<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="d-flex flex-column min-vh-100">
<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <section class="page-card p-4 p-md-5 w-100" style="max-width: 430px;" aria-labelledby="titulo-login">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="d-inline-block mb-3" aria-label="Voltar à página inicial">
                <img th:src="@{/imagens/loja.png}" alt="" width="56" height="56"
                     loading="eager" decoding="async" fetchpriority="high" data-image-priority="high">
            </a>
            <h1 id="titulo-login" class="h3 fw-bold mb-1">Acessar conta</h1>
            <p class="text-muted mb-0">Entre com seu e-mail e senha.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Usuário ou senha inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            Você saiu com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="username" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="username" name="username"
                       autocomplete="username" autofocus required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="text-center small mt-4 mb-0">
            Não possui conta?
            <a th:href="@{/formcliente}">Cadastre-se</a>
        </p>
    </section>
</main>

<footer class="mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
