<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pedidos administrativos')}"></head>
<body class="d-flex flex-column min-vh-100">
<header>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
</header>

<main class="container flex-grow-1 py-5">
    <section class="page-card p-3 p-md-4" aria-labelledby="titulo-lista-pedidos">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <div>
                <h1 id="titulo-lista-pedidos" class="h2 fw-bold mb-1">Pedidos</h1>
                <p class="text-muted mb-0">Acompanhe e edite os pedidos cadastrados.</p>
            </div>
            <a th:href="@{/pedidosadmin/form}" class="btn btn-primary">Novo pedido</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0">
                <caption class="visually-hidden">Lista de pedidos cadastrados</caption>
                <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Data</th>
                    <th scope="col">Usuário</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Valor total</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}">1</td>
                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${pedido.usuario != null ? pedido.usuario.id : '-'}">-</td>
                    <td>
                        <span class="badge"
                              th:classappend="${pedido.status != null && pedido.status.name() == 'FINALIZADO'} ? 'text-bg-success' : 'text-bg-warning'"
                              th:text="${pedido.status != null ? pedido.status : 'PENDENTE'}">PENDENTE</span>
                    </td>
                    <td class="text-end text-nowrap"
                        th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 2)}">R$ 0,00</td>
                    <td class="text-end table-action-group">
                        <div class="d-inline-flex flex-column flex-sm-row gap-2">
                            <a th:href="@{/pedidosadmin/editar/{id}(id=${pedido.id})}"
                               class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{/pedidosadmin/deletar/{id}(id=${pedido.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-danger btn-sm w-100"
                                        onclick="return confirm('Deseja excluir este pedido?')">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="6" class="empty-state">Nenhum pedido cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="mt-auto" th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
