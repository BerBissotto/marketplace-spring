<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${titulo} + ' | Marketplace'">Marketplace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/marketplace.css}">
    <script>
        document.documentElement.classList.add('motion-enabled');
        window.__marketplaceMotionFallback = window.setTimeout(function () {
            document.documentElement.classList.add('motion-ready');
        }, 2500);
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer th:src="@{/js/marketplace-motion.js}"></script>
</head>
<body></body>
</html>
